:root{--u:calc(210mm / 595.5);--teal:#0da8a6;--navy:#15445a}
*{box-sizing:border-box}
body{margin:0;background:#e6e9e9;font-family:'Readex Pro','Cairo',Tahoma,Arial,sans-serif}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #d5dada;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px}
.bar button{font:500 14px 'Readex Pro',Tahoma,sans-serif;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;background:var(--teal);color:#fff}
.bar .s{background:#fff;color:#333;border:1px solid #ccc}.bar .d{background:#c0392b}
.st{font-size:12px;color:#555;min-width:90px;text-align:center}
.wrap{display:flex;justify-content:center;padding:14px 0 30px}
.page{position:relative;width:210mm;height:296.8mm;background:#fff;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.2)}
.a{position:absolute}
.a img{width:100%;height:100%;display:block}
.ttl{text-align:center;font-weight:500;font-size:calc(18.4*var(--u));line-height:calc(25.3*var(--u));color:var(--navy);white-space:nowrap}
.hc,.sb{background:var(--teal);color:#fff;border:calc(.6*var(--u)) solid #c2c2c2;display:flex;align-items:center;justify-content:center;font-size:calc(10.1*var(--u))}
.sb{border-color:var(--teal);overflow:hidden;font-weight:400}
.v{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;white-space:nowrap}
.cell{border:calc(.6*var(--u)) solid #c2c2c2;background:#fff}
.c{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 calc(8*var(--u));font-size:calc(10*var(--u));font-weight:400;color:var(--navy);line-height:1.5;white-space:pre-wrap;word-break:break-word;outline:0;cursor:text}
.ft{border:calc(.75*var(--u)) solid #c2c2c2;color:var(--navy);font-size:calc(9.3*var(--u));display:flex;align-items:center;justify-content:flex-start;padding-right:calc(7*var(--u))}
#wk{outline:0}
@media screen{.c:hover{background:#eefaf8}.c:focus,#wk:focus{background:#dff5f2;box-shadow:inset 0 0 0 2px var(--teal)}}
@page{size:A4;margin:0}
@media print{.bar{display:none!important}html,body{background:#fff!important;margin:0}.wrap{padding:0;display:block}.page{box-shadow:none;zoom:1!important;break-after:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
